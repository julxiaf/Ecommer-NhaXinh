$kind: http-request
name: Me
method: GET
url: '{{base_url}}/api/v1/auth/me'
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response có field authenticated", function () {
          var json = pm.response.json();
          pm.expect(json).to.have.property("authenticated");
          pm.expect(json.authenticated).to.be.a("boolean");
      });

      if (pm.response.json().authenticated) {
          pm.test("Khi đã login - username không rỗng", function () {
              var json = pm.response.json();
              pm.expect(json).to.have.property("username");
              pm.expect(json.username).to.be.a("string").and.not.empty;
          });
      } else {
          pm.test("Khi chưa login - username là null", function () {
              var json = pm.response.json();
              pm.expect(json.username).to.be.null;
          });
      }
