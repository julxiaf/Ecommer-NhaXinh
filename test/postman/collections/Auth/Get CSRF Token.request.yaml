$kind: http-request
name: 'Get CSRF Token'
method: GET
url: '{{base_url}}/api/v1/auth/csrf'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response has token", function () {
          var json = pm.response.json();
          pm.expect(json).to.have.property("token");
          pm.expect(json.token).to.be.a("string").and.not.empty;
      });

      // Lưu CSRF token vào collection variable để dùng cho Login
      var json = pm.response.json();
      if (json.token) {
          pm.collectionVariables.set("csrf_token", json.token);
          console.log("CSRF token saved:", json.token);
      }
