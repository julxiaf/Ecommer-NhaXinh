# =====================================================
# SPRING APPLICATION CONFIGURATION
# =====================================================
spring.application.name=main
spring.config.import=optional:file:.env[.properties],optional:file:server/.env[.properties]
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
# =====================================================
# MYSQL DATABASE CONNECTION
# =====================================================
# MySQL Connection URL
# spring.datasource.url=jdbc:mysql://<HOST>:<PORT>/<DATABASE_NAME>?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
# Example:
# spring.datasource.url=jdbc:mysql://localhost:3306/databasename?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.url=${DB_URL}

# MySQL Credentials
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# MySQL Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================================
# HIKARI CONNECTION POOL (Performance Optimization)
# =====================================================
# Maximum number of connections in the pool
spring.datasource.hikari.maximum-pool-size=10

# Minimum number of idle connections
spring.datasource.hikari.minimum-idle=5

# Connection timeout (ms)
spring.datasource.hikari.connection-timeout=30000

# Maximum lifetime of a connection (ms)
spring.datasource.hikari.max-lifetime=600000

# Idle timeout (ms)
spring.datasource.hikari.idle-timeout=300000

# Connection test query
# spring.datasource.hikari.connection-test-query=SELECT 1
server.address=${ADDR_SERVER:0.0.0.0}
server.port=${PORT_SERVER:8080}
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=120MB
app.media.storage-dir=${MEDIA_STORAGE_DIR:uploads/products}
app.vnpay.tmn-code=${VNPAY_TMN_CODE:PTA3FMH7}
app.vnpay.hash-secret=${VNPAY_HASH_SECRET:NATJZPIHQJEYOVLFFVBANQMSEBPNFEBW}
app.vnpay.payment-url=${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
app.vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/api/v1/payments/vnpay/return}
app.vnpay.ipn-url=${VNPAY_IPN_URL:http://localhost:8080/api/v1/payments/vnpay/ipn}
app.frontend.payment-result-url=${FRONTEND_PAYMENT_RESULT_URL:http://localhost:5173/payment/result}
# Pool name
spring.datasource.hikari.pool-name=NHAXINH

# =====================================================
# JPA / HIBERNATE CONFIGURATION
# =====================================================
# Hibernate DDL auto (create, update, validate, none)
# - update: Update schema, preserve data (recommended for development)
# - create: Drop and create schema (lose data)
# - validate: Validate schema, don't change
# - none: Disable DDL generation
spring.jpa.hibernate.ddl-auto=update

# Show SQL in console
# spring.jpa.show-sql=true

# Format SQL for better readability
spring.jpa.properties.hibernate.format_sql=validate

# SQL dialect for MySQL 8
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Specify default catalog/schema to prevent NPE during metadata extraction
spring.jpa.properties.hibernate.default_catalog=nhaxinhf12
spring.jpa.properties.hibernate.default_schema=nhaxinhf12

# Use standard physical naming strategy (preserving camelCase from @Column names)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Enable batch processing for better performance
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Enable JPA auditing (for created_at, updated_at)
spring.jpa.properties.org.springframework.data.auditing.datetime-provider=org.springframework.data.auditing.DateTimeProvider

# =====================================================
# LOGGING CONFIGURATION
# =====================================================
# Logging level for application
logging.level.backend.main=debug
spring.output.ansi.enabled=ALWAYS
logging.level.vn.nhaxinh=DEBUG
# Logging level for Hibernate SQL
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Logging level for Spring Security
logging.level.org.springframework.security=info
logging.level.root=info
# Logging level for database connection
logging.level.com.zaxxer.hikari=DEBUG

# File log chính
logging.file.name=logs/application.log

# Rolling theo ngày + size
logging.logback.rollingpolicy.file-name-pattern=logs/application-%d{dd-MM-yyyy}-%i.log

# Giữ 30 ngày
#logging.logback.rollingpolicy.max-history=30

# Tổng dung lượng log tối đa (optional)
logging.logback.rollingpolicy.total-size-cap=1GB

# Format log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# SpringDoc Swagger-UI & OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true

# =====================================================
# SPRING DATA JPA REPOSITORIES
# =====================================================
# Enable default transactions
spring.jpa.open-in-view=false

# =====================================================
# JACKSON CONFIGURATION (JSON Serialization)
# =====================================================
# Format dates in ISO format
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# Timezone for date serialization
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Serialize null fields as empty
# =====================================================
# GEMINI AI CONFIGURATION
# =====================================================
gemini.api.key=${GEMINI_API_KEY:}

# =====================================================
# EMAIL CONFIGURATION (SMTP)
# =====================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
